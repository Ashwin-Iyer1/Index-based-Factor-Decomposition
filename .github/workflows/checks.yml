name: Risk model and workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Install lightweight research test dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.3.3 pytest==8.4.2
      - name: Python research tests with fake forecast evaluator
        run: python -m pytest -q tests
      - name: Install locked browser dependencies
        run: npm --prefix workbench ci
      - name: Regenerate public model and independent Python parity fixtures
        run: npm --prefix workbench run data
      - name: Risk attribution and Python parity tests
        run: npm --prefix workbench test
      - name: Typecheck and build portable workbench
        run: npm --prefix workbench run build
